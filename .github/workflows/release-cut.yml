name: Release Cut

# Manually triggered. Cuts release/<version> branch + v<version>-rc1 tag from main.
# Pushing to release/<version> then triggers ci-backend.yml against that branch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver, e.g. 3.3.0 (no leading v).'
        required: true
        type: string

jobs:
  cut:
    uses: comp/comp-proj-shared-lib/.github/workflows/release-cut.yml@main
    with:
      version: ${{ inputs.version }}
      base_branch: main
