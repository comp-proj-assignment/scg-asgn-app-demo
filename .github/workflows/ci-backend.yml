name: CI — backend

# Spring Boot service. Pipeline lives in comp-proj-shared-lib.
#
# On push to main:    test → image → scan/sbom/sign → bump deploy repo (DEV)
# On PR / release/*:  test → image → scan/sbom/sign (no bump)

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'app/backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'app/backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  pipeline:
    # TODO(release-mgmt): switch to @v1 once comp-proj-shared-lib v1.0.0 ships.
    uses: comp/comp-proj-shared-lib/.github/workflows/service-pipeline.yml@main
    with:
      service_name: api
      service_path: app/backend
      language: java
      language_version: '21'

      # Coverage starts at 0 — backend has near-zero tests today.
      # Raise this to 80 after the team backfills tests on the controller +
      # service layer. Tracked in the deploy repo's CODEOWNERS review.
      coverage_threshold: 0

      # Spotless / static-analysis tooling not yet in pom.xml.
      enable_format_check: false
      enable_lint: false

      # CI uses the slim Dockerfile that consumes the prebuilt layered jar.
      dockerfile: Dockerfile.ci

      # Image
      registry: ghcr.io
      # registry_namespace defaults to ${{ github.repository_owner }} lowercased.

      # Security
      enable_image_scan: true
      enable_image_sign: true
      enable_sbom: true
      enable_dast_scan: false   # DAST is deploy-time, not build-time.

      # GitOps
      deploy_repo: comp/comp-proj-app-demo-deployment
      target_env: dev
    secrets:
      DEPLOY_REPO_PAT: ${{ secrets.DEPLOY_REPO_PAT }}
