name: CI — frontend

# Stand-alone CI for the Next.js frontend.
#
# TODO(platform): migrate to comp-proj-shared-lib service-pipeline once node
# support lands (setup-language / run-tests / build-language for node are
# stubbed in shared-lib v1). Until then this workflow runs lint+test+build
# inline so PRs are still gated.

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'app/frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'app/frontend/**'
      - '.github/workflows/ci-frontend.yml'

defaults:
  run:
    working-directory: app/frontend

jobs:
  ci:
    name: lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --run

      - run: npm run build
