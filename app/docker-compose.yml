services:
  backend:
    build:
      context: ./backend
    image: comp-proj/api:local
    environment:
      APP_VERSION: v3.3.0
      APP_POD_NAME: api-local
      APP_ROLLOUT_COLOR: blue
      SPRING_APPLICATION_JSON: '{"app":{"version":"v3.3.0","pod-name":"api-local","rollout-color":"blue"}}'
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    image: comp-proj/web:local
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_APP_VERSION: v3.3.0
      POD_NAME: web-local
      ROLLOUT_COLOR: blue
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
